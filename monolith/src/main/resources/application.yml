spring:
  application:
    name: monolith
  datasource:
    url: jdbc:mysql://localhost:3306/monolith
    username: study
    password: study
  jpa:
    hibernate:
      ddl-auto: update   # 학습용. 스키마 변경이 꼬이면 create로 바꿔 초기화한다.
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379

logging:
  level:
    org.hibernate.SQL: debug
    # 트랜잭션 시작/커밋/롤백 로그 (1단계 실험용)
    org.springframework.orm.jpa.JpaTransactionManager: debug
